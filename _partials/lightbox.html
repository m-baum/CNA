<script>
(function(){
  function initLightbox(){
    var links = Array.prototype.slice.call(document.querySelectorAll('a.cna-lb'));
    if(!links.length) return;

    var wrap = document.createElement('div');
    wrap.className = 'cna-lightbox';
    wrap.setAttribute('role','dialog');
    wrap.setAttribute('aria-modal','true');
    wrap.innerHTML =
      '<div class="lb-body">' +
        '<button class="lb-close" aria-label="Close">&times;</button>' +
        '<button class="lb-nav lb-prev" aria-label="Previous">&lsaquo;</button>' +
        '<img src="" alt="">' +
        '<button class="lb-nav lb-next" aria-label="Next">&rsaquo;</button>' +
      '</div>' +
      '<div class="lb-caption"></div>';
    document.body.appendChild(wrap);

    var img = wrap.querySelector('img');
    var caption = wrap.querySelector('.lb-caption');
    var close = wrap.querySelector('.lb-close');
    var prev = wrap.querySelector('.lb-prev');
    var next = wrap.querySelector('.lb-next');
    var current = 0;

    function show(i){
      current = (i + links.length) % links.length;
      var l = links[current];
      img.src = l.getAttribute('href');
      img.alt = l.getAttribute('data-caption') || '';
      caption.textContent = l.getAttribute('data-caption') || '';
      wrap.classList.add('open');
      document.body.classList.add('lb-open');
    }
    function closeLb(){
      wrap.classList.remove('open');
      document.body.classList.remove('lb-open');
      img.src = '';
    }

    links.forEach(function(l, idx){
      l.addEventListener('click', function(e){
        e.preventDefault(); show(idx);
      });
    });
    close.addEventListener('click', closeLb);
    prev.addEventListener('click', function(){ show(current-1); });
    next.addEventListener('click', function(){ show(current+1); });
    wrap.addEventListener('click', function(e){
      if(e.target === wrap) closeLb();
    });
    document.addEventListener('keydown', function(e){
      if(!wrap.classList.contains('open')) return;
      if(e.key === 'Escape') closeLb();
      else if(e.key === 'ArrowLeft') show(current-1);
      else if(e.key === 'ArrowRight') show(current+1);
    });
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initLightbox);
  } else {
    initLightbox();
  }
})();
</script>
